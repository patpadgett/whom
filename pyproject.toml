[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whom-cli"
dynamic = ["version"]
description = "whom: who to ask about this file, and are they awake? Contributor ranking and local-time inference from git history."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Padgett" }]
keywords = ["git", "blame", "contributors", "ownership", "timezone", "cli", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["build", "ruff"]

[project.urls]
Homepage = "https://github.com/patpadgett/whom"
Issues = "https://github.com/patpadgett/whom/issues"

[project.scripts]
whom = "whom:cli"

[tool.setuptools]
py-modules = ["whom"]

[tool.setuptools.dynamic]
version = { attr = "whom.__version__" }

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["whom"]
